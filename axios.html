
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body{
            background-color: rgb(255,248,240);
        }
        .navbar{
            background-color: brown;
            padding: 15px;
        }
        .navbar-brand{
            color: white;
            font-weight: bold;
        }
        .navbar-brand:hover{
            color: white;
        }
        .btn-custom{
            background-color: brown;
            color: white;
        }
        .btn-custom:hover{
            background-color: rgb(180,60,60);
            color: white;
        }
        .foDoboz{
            margin-top: 40px;
        }

    </style>

</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                Axios CRUD
            </a>

            <div class="ms-auto">

                <a href="index.html" class="btn btn-dark">
                    ←
                </a>

            </div>
        </div>
    </nav>

    <div class="container foDoboz">
        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Süti CRUD rendszer
            </h2>

            <div class="row">
                <div class="col-md-4">

                    <input type="text" id="nev" class="form-control" placeholder="Süti neve">

                </div>

                <div class="col-md-4">

                    <input type="text" id="tipus" class="form-control" placeholder="Típus">

                </div>

                <div class="col-md-4">

                    <input type="number" id="dijazott" class="form-control" placeholder="Díjazott">

                </div>
            </div>

            <div class="text-center mt-4">

                <button class="btn btn-custom" onclick="ujSuti()">
                    Hozzáadás
                </button>

            </div>

            <table class="table table-bordered table-striped text-center mt-4">
                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Név</th>
                        <th>Típus</th>
                        <th>Díjazott</th>
                        <th>Műveletek</th>

                    </tr>

                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function adatokBetoltese(){
            axios.get("axiosapi.php")
            .then(response => {
                let body = document.getElementById("tablaBody");
                body.innerHTML = "";
                response.data.forEach(suti => {
                    body.innerHTML += `

                    <tr>

                        <td>${suti.id}</td>
                        <td>${suti.nev}</td>
                        <td>${suti.tipus}</td>
                        <td>${suti.dijazott}</td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2" onclick="modositas(${suti.id},'${suti.nev}','${suti.tipus}','${suti.dijazott}')">
                                Szerkesztés
                            </button>

                            <button class="btn btn-danger btn-sm" onclick="torles(${suti.id})">
                                Törlés
                            </button>
                        </td>
                    </tr>
                    `;
                });
            });
        }

        function ujSuti(){
            let nev = document.getElementById("nev").value;
            let tipus = document.getElementById("tipus").value;
            let dijazott = document.getElementById("dijazott").value;
            axios.post("axiosapi.php",{

                nev: nev,
                tipus: tipus,
                dijazott: dijazott

            })
            .then(() => {
                adatokBetoltese();
            });

        }

        function torles(id){
            axios.delete("axiosapi.php?id=" + id)
            .then(() => {
                adatokBetoltese();
            });
        }

        function modositas(id,nev,tipus,dijazott){
            let ujNev = prompt("Új név:",nev);
            let ujTipus = prompt("Új típus:",tipus);
            let ujDijazott = prompt("Díjazott:",dijazott);
            axios.put("axiosapi.php",{

                id: id,
                nev: ujNev,
                tipus: ujTipus,
                dijazott: ujDijazott

            })
            .then(() => {
                adatokBetoltese();

            });
        }

        adatokBetoltese();

    </script>
</body>
