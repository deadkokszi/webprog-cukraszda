<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>

        body{
            background-color: rgb(255,248,240);
        }

        .navbar{
            background-color: brown;
        }

        .navbar-brand{
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover{
            color: white;
        }

        .foDoboz{
            margin-top: 40px;
        }

        .card{
            border-radius: 15px;
        }

        .btn-custom{
            background-color: brown;
            color: white;
        }

        .btn-custom:hover{
            background-color: rgb(180,60,60);
            color: white;
        }

    </style>

</head>
<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                Axios CRUD
            </a>

            <div class="ms-auto">

                <a href="index.html" class="btn btn-dark">
                    ←
                </a>

            </div>

        </div>

    </nav>

    <div id="root"></div>

    <script type="text/babel">

        function App(){

            const [sutik,setSutik] = React.useState([]);

            const [nev,setNev] = React.useState("");

            const [tipus,setTipus] = React.useState("");

            const [dijazott,setDijazott] = React.useState("");



            React.useEffect(() => {

                adatokBetoltese();

            },[]);



            function adatokBetoltese(){

                axios.get("api.php")

                .then(response => {

                    setSutik(response.data);

                });

            }



            function ujSuti(){

                axios.post("api.php",{

                    nev: nev,
                    tipus: tipus,
                    dijazott: dijazott

                })

                .then(() => {

                    adatokBetoltese();

                    setNev("");
                    setTipus("");
                    setDijazott("");

                });

            }



            function torles(id){

                axios.delete("api.php?id=" + id)

                .then(() => {

                    adatokBetoltese();

                });

            }



            function modositas(suti){

                let ujNev = prompt("Új név:", suti.nev);

                let ujTipus = prompt("Új típus:", suti.tipus);

                let ujDijazott = prompt("Díjazott:", suti.dijazott);

                axios.put("api.php",{

                    id: suti.id,
                    nev: ujNev,
                    tipus: ujTipus,
                    dijazott: ujDijazott

                })

                .then(() => {

                    adatokBetoltese();

                });

            }



            return(

                <div className="container foDoboz">

                    <div className="card shadow p-4">

                        <h2 className="text-center mb-4">
                            Axios CRUD rendszer
                        </h2>

                        <div className="row">

                            <div className="col-md-4">

                                <input
                                    type="text"
                                    className="form-control"
                                    placeholder="Süti neve"
                                    value={nev}
                                    onChange={(e) => setNev(e.target.value)}
                                />

                            </div>

                            <div className="col-md-4">

                                <input
                                    type="text"
                                    className="form-control"
                                    placeholder="Típus"
                                    value={tipus}
                                    onChange={(e) => setTipus(e.target.value)}
                                />

                            </div>

                            <div className="col-md-4">

                                <input
                                    type="number"
                                    className="form-control"
                                    placeholder="Díjazott"
                                    value={dijazott}
                                    onChange={(e) => setDijazott(e.target.value)}
                                />

                            </div>

                        </div>

                        <div className="text-center mt-4">

                            <button className="btn btn-custom" onClick={ujSuti}>
                                Hozzáadás
                            </button>

                        </div>

                        <table className="table table-bordered table-striped text-center mt-4">

                            <thead className="table-dark">

                                <tr>
                                    <th>ID</th>
                                    <th>Név</th>
                                    <th>Típus</th>
                                    <th>Díjazott</th>
                                    <th>Műveletek</th>
                                </tr>

                            </thead>

                            <tbody>

                                {
                                    sutik.map((suti,index) => (

                                        <tr key={index}>

                                            <td>{suti.id}</td>
                                            <td>{suti.nev}</td>
                                            <td>{suti.tipus}</td>
                                            <td>{suti.dijazott}</td>

                                            <td>

                                                <button
                                                    className="btn btn-warning btn-sm me-2"
                                                    onClick={() => modositas(suti)}
                                                >
                                                    Szerkesztés
                                                </button>

                                                <button
                                                    className="btn btn-danger btn-sm"
                                                    onClick={() => torles(suti.id)}
                                                >
                                                    Törlés
                                                </button>

                                            </td>

                                        </tr>

                                    ))
                                }

                            </tbody>

                        </table>

                    </div>

                </div>

            );

        }



        const root = ReactDOM.createRoot(document.getElementById("root"));

        root.render(<App />);

    </script>

</body>
</html>
