<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color: rgb(255, 248, 240);
        }

        .navbar{
            background-color: brown;
        }

        .navbar-brand{
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover{
            color: white;
        }

        .container-fluid{
            display: flex;
            align-items: center;
        }

        .foDoboz{
            margin-top: 40px;
        }

        .card{
            border-radius: 15px;
        }

        .btn-custom{
            background-color: brown;
            color: white;
        }

        .btn-custom:hover{
            background-color: rgb(180, 60, 60);
            color: white;
        }

    </style>

</head>
<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                Fetch API CRUD
            </a>

            <div class="ms-auto">

                <a href="index.html" class="btn btn-dark">
                    ←
                </a>

            </div>

        </div>

    </nav>

    <div class="container foDoboz">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Süti CRUD rendszer
            </h2>

            <div class="row">

                <div class="col-md-4">
                    <input type="text" id="nev" class="form-control" placeholder="Süti neve">
                </div>

                <div class="col-md-4">
                    <input type="text" id="tipus" class="form-control" placeholder="Típus">
                </div>

                <div class="col-md-4">
                    <input type="number" id="dijazott" class="form-control" placeholder="Díjazott">
                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-custom" onclick="ujSuti()">
                    Hozzáadás
                </button>

            </div>

            <table class="table table-bordered table-striped text-center mt-4">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Név</th>
                        <th>Típus</th>
                        <th>Díjazott</th>
                        <th>Műveletek</th>
                    </tr>

                </thead>

                <tbody id="tablaBody"></tbody>

            </table>

        </div>

    </div>

</body>
</html>
