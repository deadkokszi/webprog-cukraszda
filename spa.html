<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA alkalmazás</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

        body{
            background-color: rgb(255, 248, 240);
        }

        .navbar{
            background-color: brown;
        }

        .navbar-brand{
            color: white;
            font-weight: bold;
        }

        .navbar-brand:hover{
            color: white;
        }

        .container-fluid{
            display: flex;
            align-items: center;
        }

        .foDoboz{
            margin-top: 40px;
        }

        .card{
            border-radius: 15px;
        }

        .btn-custom{
            background-color: brown;
            color: white;
        }

        .btn-custom:hover{
            background-color: rgb(180, 60, 60);
            color: white;
        }

    </style>

</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                SPA alkalmazás
            </a>

            <div class="ms-auto">

                <a href="index.html" class="btn btn-dark">
                    ← Vissza
                </a>

            </div>
        </div>
    </nav>

    <div id="root"></div>
    <script type="text/babel">

        function App(){
            const [menu, setMenu] = React.useState("sutik");
            return(
                <div className="container foDoboz">
                    <div className="card shadow p-4">
                        <div className="text-center mb-4">
                            <button className="btn btn-custom me-3" onClick={() => setMenu("sutik")}>
                                Összes süti
                            </button>

                            <button className="btn btn-custom" onClick={() => setMenu("dijazott")}>
                                Díjazott sütik
                            </button>

                        </div>
                        {
                            menu === "sutik"
                            ?
                            <Sutik />
                            :
                            <DijazottSutik />
                        }
                    </div>
                </div>
            );
        }
        function Sutik(){
            const [sutik] = React.useState([
                {
                    id: 1,
                    nev: "Süni",
                    tipus: "vegyes",
                    dijazott: 0
                },
                {
                    id: 2,
                    nev: "Eszterházy torta",
                    tipus: "torta",
                    dijazott: 1
                },
                {
                    id: 3,
                    nev: "Rigó Jancsi",
                    tipus: "csokoládés",
                    dijazott: 1
                }

            ]);

            return(

                <div>

                    <h2 className="text-center mb-4">
                        Összes süti
                    </h2>

                    <table className="table table-bordered table-striped text-center">

                        <thead className="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Név</th>
                                <th>Típus</th>
                                <th>Díjazott</th>
                            </tr>

                        </thead>
                        <tbody>
                            {
                                sutik.map((suti,index) => (

                                    <tr key={index}>

                                        <td>{suti.id}</td>
                                        <td>{suti.nev}</td>
                                        <td>{suti.tipus}</td>
                                        <td>{suti.dijazott}</td>

                                    </tr>

                                ))
                            }
                        </tbody>
                    </table>
                </div>
            );
        }
        function DijazottSutik(){
            const [sutik] = React.useState([
                {
                    id: 2,
                    nev: "Eszterházy torta",
                    tipus: "torta"
                },
                {
                    id: 3,
                    nev: "Rigó Jancsi",
                    tipus: "csokoládés"
                }

            ]);

            return(

                <div>

                    <h2 className="text-center mb-4">
                        Díjazott sütik
                    </h2>

                    <table className="table table-bordered table-striped text-center">
                        <thead className="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Név</th>
                                <th>Típus</th>
                            </tr>

                        </thead>
                        <tbody>
                            {
                                sutik.map((suti,index) => (

                                    <tr key={index}>

                                        <td>{suti.id}</td>
                                        <td>{suti.nev}</td>
                                        <td>{suti.tipus}</td>

                                    </tr>
                                ))
                            }
                        </tbody>
                    </table>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
