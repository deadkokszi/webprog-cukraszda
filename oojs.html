<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>OOJS</title>

    <style>

        body{
            background-color: rgb(255,248,240);
            font-family: Arial;
        }

        .navbar{
            background-color: brown;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand{
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .doboz{
            width: 300px;
            background-color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
            display: inline-block;
        }

        .dijazott{
            border: 3px solid gold;
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            OOJS alkalmazás
        </a>

        <div class="ms-auto">

            <a href="index.html" class="btn btn-dark">
                ←
            </a>

        </div>

    </div>

</nav>

    <script>

        class Suti{
            constructor(nev,tipus){
                this.nev = nev;
                this.tipus = tipus;
            }
            megjelenit(){
                let kartya = document.createElement("div");
                kartya.classList.add("doboz");
                kartya.innerHTML = `

                    <h2>${this.nev}</h2>
                    <p>Típus: ${this.tipus}</p>

                `;
                document.body.appendChild(kartya);
            }
        }

        class DijazottSuti extends Suti{
            constructor(nev,tipus,dij){
                super(nev,tipus);
                this.dij = dij;
            }

            megjelenit(){
                let kartya = document.createElement("div");
                kartya.classList.add("doboz");
                kartya.classList.add("dijazott");
                kartya.innerHTML = `

                    <h2>${this.nev}</h2>
                    <p>Típus: ${this.tipus}</p>
                    <p>Díj: ${this.dij}</p>

                `;
                document.body.appendChild(kartya);
            }
        }
        let suti1 = new Suti("Süni","vegyes");
        let suti2 = new DijazottSuti("Eszterházy torta","torta","Aranyérem");
        let suti3 = new DijazottSuti("Rigó Jancsi","csokoládés","Első hely");

        suti1.megjelenit();
        suti2.megjelenit();
        suti3.megjelenit();
    </script>
</body>
</html>
